<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Polisher - AI Email Rewriter</title>
    <style>
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 60px auto;
            padding: 20px;
            background: #f7f9fc;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #1a2a3a;
        }
        .sub {
            color: #4a627a;
            margin-bottom: 2rem;
            border-left: 4px solid #3b82f6;
            padding-left: 16px;
        }
        .quota {
            background: #eef2ff;
            padding: 8px 16px;
            border-radius: 40px;
            display: inline-block;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1e40af;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 16px;
            font-size: 1rem;
            font-family: inherit;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            resize: vertical;
            background: white;
        }
        button {
            margin-top: 16px;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
        }
        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background: #2563eb;
        }
        .result {
            margin-top: 32px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            white-space: pre-wrap;
        }
        .result-label {
            font-weight: 600;
            margin-bottom: 12px;
            color: #1e293b;
        }
        .copy-btn {
            background: #f1f5f9;
            color: #1e293b;
            margin-top: 12px;
            padding: 6px 16px;
            font-size: 0.85rem;
        }
        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
        }
        .upgrade-link {
            margin-top: 10px;
            font-size: 0.85rem;
        }
        .upgrade-link a {
            color: #3b82f6;
            text-decoration: none;
            cursor: pointer;
        }
        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            max-width: 380px;
            width: 90%;
            padding: 28px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
        }
        .modal-content h3 {
            margin-bottom: 16px;
            color: #1a2a3a;
        }
        .modal-content .price {
            font-size: 24px;
            font-weight: bold;
            color: #3b82f6;
            margin: 16px 0;
        }
        .modal-content .qrcode {
            width: 200px;
            height: 200px;
            margin: 16px auto;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            font-size: 12px;
            color: #666;
        }
        .modal-content .unlock-input {
            width: 100%;
            padding: 12px;
            margin: 16px 0;
            border: 1px solid #cbd5e1;
            border-radius: 40px;
            font-size: 1rem;
            text-align: center;
            box-sizing: border-box;
        }
        .modal-content .unlock-btn {
            background: #22c55e;
            margin-top: 0;
            width: 100%;
        }
        .modal-content .close-modal {
            background: #e2e8f0;
            color: #1e293b;
            margin-top: 12px;
            width: 100%;
        }
        .member-badge {
            background: #22c55e;
            color: white;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            margin-left: 12px;
        }
    </style>
</head>
<body>

<h1>✉️ Email Polisher <span id="memberBadge" class="member-badge" style="display: none;">⭐ 会员</span></h1>
<div class="sub">Paste your draft → AI makes it professional & polite</div>

<div class="quota" id="quotaDisplay">📊 今日剩余: 加载中...</div>

<textarea id="inputEmail" placeholder="Paste your email here...&#10;&#10;Example:&#10;hey can you send me the price list? thanks"></textarea>
<br>
<button id="polishBtn">✨ Polish with AI</button>

<div class="result" id="resultArea" style="display: none;">
    <div class="result-label">✨ AI Polished Version</div>
    <div id="polishedText"></div>
    <button id="copyBtn" class="copy-btn">📋 Copy to clipboard</button>
</div>

<div class="footer">
    🧠 Powered by DeepSeek · 每天免费 5 次 · 升级会员 ¥9.9/月 无限使用
    <div class="upgrade-link">
        💎 <a id="upgradeLink">升级会员，无限次数</a>
    </div>
</div>

<!-- 支付弹窗 -->
<div id="payModal" class="modal">
    <div class="modal-content">
        <h3>🚀 升级会员</h3>
        <p>¥9.9/月 · 无限次数使用</p>
        <div class="price">¥9.9</div>
        
        <!-- 替换后的双收款码 -->
        <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
            <div style="text-align: center;">
                <img src="wechat-pay.jpg" style="width: 140px; border-radius: 12px; border: 1px solid #e2e8f0;">
                <p style="font-size: 12px; margin-top: 8px; color: #333;">微信支付</p>
            </div>
            <div style="text-align: center;">
                <img src="alipay.png" style="width: 140px; border-radius: 12px; border: 1px solid #e2e8f0;">
                <p style="font-size: 12px; margin-top: 8px; color: #333;">支付宝</p>
            </div>
        </div>
        
        <p style="font-size: 12px; color: #666; margin-top: 16px;">扫码付款后获取解锁码</p>
        <input type="text" id="unlockCode" class="unlock-input" placeholder="输入解锁码">
        <button id="unlockBtn" class="unlock-btn">🔓 激活会员</button>
        <button class="close-modal">关闭</button>
    </div>
</div>

<script>
    const polishBtn = document.getElementById('polishBtn');
    const inputEmail = document.getElementById('inputEmail');
    const resultArea = document.getElementById('resultArea');
    const polishedTextDiv = document.getElementById('polishedText');
    const quotaDisplay = document.getElementById('quotaDisplay');
    const memberBadge = document.getElementById('memberBadge');

    // ============================================================
    // 🔧 请在这里填写你的 DeepSeek API Key

    // ============================================================

    // ========== 解锁码设置 ==========
    // 你可以在后台随时修改这个密码
    // 月付码：month2025
    // 年付码：year2025
    const VALID_CODES = {
        'month2025': 30,   // 30天
        'year2025': 365    // 365天
    };

    // ========== 会员状态 ==========
    function getProExpireTime() {
        const expire = localStorage.getItem('polish_pro_until');
        if (!expire) return 0;
        return parseInt(expire);
    }

    function isProUser() {
        const expire = getProExpireTime();
        return Date.now() < expire;
    }

    function getProDaysLeft() {
        const expire = getProExpireTime();
        if (!expire || Date.now() >= expire) return 0;
        return Math.ceil((expire - Date.now()) / (1000 * 60 * 60 * 24));
    }

    function setProUser(days) {
        const expireTime = Date.now() + days * 24 * 3600 * 1000;
        localStorage.setItem('polish_pro_until', expireTime);
        updateUI();
    }

    // ========== 次数限制（每天5次，会员不限） ==========
    function getRemainingCount() {
        if (isProUser()) return 999;
        
        const today = new Date().toDateString();
        const stored = localStorage.getItem('polish_remaining');
        const storedDate = localStorage.getItem('polish_date');
        
        if (storedDate !== today) {
            localStorage.setItem('polish_remaining', '5');
            localStorage.setItem('polish_date', today);
            return 5;
        }
        
        const remain = parseInt(stored, 10);
        return isNaN(remain) ? 5 : remain;
    }

    function setRemainingCount(count) {
        localStorage.setItem('polish_remaining', count);
        updateUI();
    }

    function decrementQuota() {
        if (isProUser()) return;
        const current = getRemainingCount();
        if (current > 0) {
            setRemainingCount(current - 1);
        }
    }

    function updateUI() {
        // 更新剩余次数显示
        const remaining = getRemainingCount();
        if (isProUser()) {
            const daysLeft = getProDaysLeft();
            quotaDisplay.innerText = `⭐ 会员剩余 ${daysLeft} 天 · 无限使用`;
            quotaDisplay.style.background = '#dcfce7';
            quotaDisplay.style.color = '#166534';
            memberBadge.style.display = 'inline-block';
        } else {
            quotaDisplay.innerText = `📊 今日剩余: ${remaining} 次`;
            quotaDisplay.style.background = '#eef2ff';
            quotaDisplay.style.color = '#1e40af';
            memberBadge.style.display = 'none';
        }
    }

    // ========== 弹窗逻辑 ==========
    const modal = document.getElementById('payModal');
    const unlockCodeInput = document.getElementById('unlockCode');
    const unlockBtn = document.getElementById('unlockBtn');

    function showPayModal() {
        modal.style.display = 'flex';
    }

    function closePayModal() {
        modal.style.display = 'none';
        unlockCodeInput.value = '';
    }

    document.getElementById('upgradeLink').addEventListener('click', (e) => {
        e.preventDefault();
        showPayModal();
    });

    document.querySelectorAll('.close-modal').forEach(btn => {
        btn.addEventListener('click', closePayModal);
    });

    // 解锁会员
    unlockBtn.addEventListener('click', () => {
        const code = unlockCodeInput.value.trim();
        const days = VALID_CODES[code];
        
        if (days) {
            setProUser(days);
            closePayModal();
            alert(`✅ 会员激活成功！有效期 ${days} 天\n\n现在可以无限次使用啦～`);
            updateUI();
        } else {
            alert('❌ 解锁码错误，请检查后重新输入');
        }
    });

    // 点击弹窗背景关闭
    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            closePayModal();
        }
    });

    // ========== AI 润色主逻辑 ==========
    async function polishWithAI(emailText) {
    // 替换成你实际的 Worker 地址
    const WORKER_URL = 'https://email-polisher-api.13683595045.workers.dev';

    const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ emailText: emailText })
    });

    const data = await response.json();

    if (!response.ok) {
        throw new Error(data.error || `API error: ${response.status}`);
    }

    return data.polished;
}

    polishBtn.addEventListener('click', async () => {
        const original = inputEmail.value.trim();
        if (!original) {
            alert('Please paste an email first.');
            return;
        }

        // 检查次数
        if (!isProUser()) {
            const remaining = getRemainingCount();
            if (remaining <= 0) {
                alert('✨ 今日免费次数已用完！\n\n升级会员（¥9.9/月）即可无限次使用。');
                showPayModal();
                return;
            }
        }

        // 显示加载状态
        const originalText = polishBtn.innerText;
        polishBtn.disabled = true;
        polishBtn.innerText = '🤖 AI is thinking...';
        
        try {
            const polished = await polishWithAI(original);
            polishedTextDiv.innerText = polished;
            resultArea.style.display = 'block';
            
            // 非会员扣除次数
            if (!isProUser()) {
                decrementQuota();
            }
            updateUI();
        } catch (error) {
            console.error('Polish error:', error);
            alert('AI polishing failed: ' + error.message);
        } finally {
            polishBtn.disabled = false;
            polishBtn.innerText = originalText;
        }
    });

    // 复制功能
    document.getElementById('copyBtn')?.addEventListener('click', () => {
        const textToCopy = polishedTextDiv.innerText;
        navigator.clipboard.writeText(textToCopy).then(() => {
            const copyBtn = document.getElementById('copyBtn');
            const originalText = copyBtn.innerText;
            copyBtn.innerText = '✅ Copied!';
            setTimeout(() => {
                copyBtn.innerText = originalText;
            }, 1500);
        });
    });

    // 初始化
    updateUI();
</script>

</body>
</html>
